# Entorno LOCAL de aprendizaje: SonarQube + la API.
#
#   docker compose up -d sonarqube              # http://localhost:9000  (admin/admin)
#   bash scripts/local/pipeline-local.sh        # reproduce el pipeline en tu máquina
#   docker compose up -d --build api            # requiere `mvn package` antes
services:
  sonarqube:
    image: sonarqube:26.10.0.133078-community
    container_name: sonarqube-calidad
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

  api:
    build: .
    image: tareas-api:local
    container_name: tareas-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
