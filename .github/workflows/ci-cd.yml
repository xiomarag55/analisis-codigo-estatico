# =============================================================================
#  PIPELINE CI/CD - tareas-api
#
#   1 · Configuración ─▶ 2 · Build + pruebas ─▶ 3 · Aceptación Karate ─┐
#       versión, enforcer,    unit, IT, JaCoCo, PMD   sobre la imagen Docker    ├─▶ 5 · Release ─▶ 6 · Despliegue
#       conventional commits                                                  │    tag, GHCR       Render + smoke test
#   1 ─────────────────────────▶ 4 · Quality Gate SonarQube Cloud ─────────────┘
#                                 (espera el Análisis Automático de este commit)
#
#  Cualquier gate que falle detiene el pipeline: nada se libera ni se despliega sin pasar todo.
#  5 y 6 solo corren en push a master.
# =============================================================================
name: CI-CD

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  MAVEN_ARGS: -B --no-transfer-progress
  IMAGE_NAME: tareas-api

jobs:
  # ===========================================================================
  # 1. GESTIÓN DE LA CONFIGURACIÓN
  # ===========================================================================
  configuracion:
    name: 1 · Gestión de la configuración
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      es_release: ${{ steps.version.outputs.es_release }}
      ya_liberada: ${{ steps.version.outputs.ya_liberada }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # historial y tags completos para calcular la versión

      - name: Validar Conventional Commits del Pull Request
        if: github.event_name == 'pull_request'
        run: bash scripts/release/check-commits.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Calcular versión semántica
        id: version
        run: |
          NEXT=$(bash scripts/release/next-version.sh)
          # Release: push a master, o ejecución manual (Run workflow) sobre master
          if [[ "${{ github.ref }}" == "refs/heads/master" && "${{ github.event_name }}" =~ ^(push|workflow_dispatch)$ ]]; then
            VERSION="$NEXT"; ES_RELEASE=true
          else
            # Versiones de pre-release: trazables pero nunca confundibles con un release
            VERSION="${NEXT}-build.${{ github.run_number }}"; ES_RELEASE=false
          fi
          # Si el commit ya se liberó (p. ej. al relanzar a mano), no se re-publica: solo se re-despliega
          YA_LIBERADA=false
          git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null && YA_LIBERADA=true
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "es_release=$ES_RELEASE" >> "$GITHUB_OUTPUT"
          echo "ya_liberada=$YA_LIBERADA" >> "$GITHUB_OUTPUT"
          {
            echo "## 🏷️ Gestión de la configuración"
            echo "| Elemento | Valor |"
            echo "|---|---|"
            echo "| Versión | \`$VERSION\` |"
            echo "| ¿Release? | $ES_RELEASE |"
            echo "| ¿Ya liberada? | $YA_LIBERADA |"
            echo "| Último tag | \`$(git describe --tags --abbrev=0 2>/dev/null || echo 'ninguno')\` |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Rama | \`${GITHUB_REF_NAME}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Validar entorno y POM (maven-enforcer)
        run: mvn validate -Drevision=${{ steps.version.outputs.version }}

      - name: Verificar que los umbrales de complejidad PMD y SonarQube coinciden
        run: |
          pmd_cog=$(grep -A3 'CognitiveComplexity"' quality/pmd-ruleset.xml | grep -oE 'value="[0-9]+"' | grep -oE '[0-9]+')
          sonar_cog=$(jq -r '.qualityProfile.rules[] | select(.key=="java:S3776") | .params' quality/quality-gate.json | grep -oE '[0-9]+')
          echo "Cognitiva -> PMD: $pmd_cog | SonarQube: $sonar_cog"
          [[ "$pmd_cog" == "$sonar_cog" ]] || { echo "::error::Umbrales de complejidad cognitiva desalineados"; exit 1; }

  # ===========================================================================
  # 2. INTEGRACIÓN CONTINUA + PRUEBAS CONTINUAS
  # ===========================================================================
  integracion-continua:
    name: 2 · Build y pruebas continuas
    needs: configuracion
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write   # para publicar el reporte JUnit como "check"
    env:
      VERSION: ${{ needs.configuracion.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compilar
        run: mvn compile -Drevision=$VERSION

      - name: Pruebas unitarias (Surefire)
        run: mvn test -Drevision=$VERSION

      - name: Pruebas de integración + Quality Gate local (cobertura JaCoCo + complejidad PMD)
        run: mvn verify -Drevision=$VERSION

      - name: Publicar resultados de pruebas
        if: always()
        uses: dorny/test-reporter@31a54ee7ebcacc03a09ea97a7e5465a47b84aea5 # v1.9.1
        with:
          name: Resultados JUnit (unitarias + integración)
          path: target/surefire-reports/TEST-*.xml,target/failsafe-reports/TEST-*.xml
          reporter: java-junit
          fail-on-empty: false
        continue-on-error: true   # en PRs desde forks no hay permiso para crear el check

      - name: Resumen de cobertura
        if: always()
        run: |
          csv=target/site/jacoco-merged/jacoco.csv
          [[ -f $csv ]] || exit 0
          awk -F, 'NR>1 {bm+=$6; bc+=$7; lm+=$8; lc+=$9}
            END {printf "## 🧪 Pruebas continuas\n| Cobertura | %% |\n|---|---|\n| Líneas | %.1f |\n| Ramas | %.1f |\n",
                 100*lc/(lm+lc), (bm+bc>0 ? 100*bc/(bm+bc) : 100)}' $csv >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar artefacto y reportes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build
          retention-days: 7
          path: |
            target/tareas-api.jar
            target/classes/
            target/test-classes/
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco-merged/
            target/pmd.xml

  # ===========================================================================
  # 3. PRUEBAS DE ACEPTACIÓN (Karate) sobre la imagen Docker candidata a release
  # ===========================================================================
  aceptacion:
    name: 3 · Pruebas de aceptación (Karate)
    needs: [configuracion, integracion-continua]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.configuracion.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build
          path: target

      - name: Construir imagen candidata
        run: |
          docker build -t $IMAGE_NAME:$VERSION \
            --build-arg VERSION=$VERSION --build-arg REVISION=$GITHUB_SHA .

      - name: Desplegar en entorno efímero de pruebas
        run: |
          docker run -d --name app -p 8080:8080 -e SPRING_PROFILES_ACTIVE=ci $IMAGE_NAME:$VERSION
          for i in $(seq 1 30); do
            [[ "$(docker inspect -f '{{.State.Health.Status}}' app)" == "healthy" ]] && exit 0
            sleep 3
          done
          docker logs app; exit 1

      - name: Ejecutar Karate (smoke + regresión)
        run: >
          mvn -f acceptance-tests/pom.xml test
          -Dkarate.env=ci
          -DbaseUrl=http://localhost:8080
          -DexpectedVersion=$VERSION

      - name: Logs de la aplicación
        if: failure()
        run: docker logs app

      - name: Publicar reporte Karate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: karate-report
          path: acceptance-tests/target/karate-reports/
          retention-days: 30

      - name: Guardar imagen probada (se promociona tal cual en el release)
        run: docker save $IMAGE_NAME:$VERSION | gzip > imagen.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: imagen-docker
          path: imagen.tar.gz
          retention-days: 7

  # ===========================================================================
  # 4. QUALITY GATE de SonarQube Cloud
  # El análisis lo hace SonarQube Cloud por su cuenta (Análisis Automático);
  # este job espera el resultado de ESTE commit y falla si el gate no pasa.
  # Solo en master y en PRs: son los que analiza el Análisis Automático.
  # ===========================================================================
  quality-gate:
    name: 4 · Quality Gate SonarQube Cloud
    needs: configuracion
    if: github.ref == 'refs/heads/master' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Esperar el veredicto del Quality Gate
        env:
          # En un PR, GITHUB_SHA es un commit de merge; SonarQube Cloud analiza la cabeza del PR
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
          SONAR_PROJECT_KEY: ${{ github.repository_owner }}_${{ github.event.repository.name }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_WAIT_SECONDS: 600
        run: bash scripts/sonar/wait-sonarcloud-gate.sh

  # ===========================================================================
  # 5. RELEASE (push o ejecución manual en master, y si TODO lo anterior pasó)
  # ===========================================================================
  release:
    name: 5 · Release
    needs: [configuracion, aceptacion, quality-gate]
    if: needs.configuracion.outputs.es_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # crear tag y GitHub Release
      packages: write   # publicar imagen en GHCR
    outputs:
      image: ${{ steps.imagen.outputs.image }}
    env:
      VERSION: ${{ needs.configuracion.outputs.version }}
      YA_LIBERADA: ${{ needs.configuracion.outputs.ya_liberada }}
    steps:
      - name: Referencia de la imagen
        id: imagen
        run: |
          IMAGE_REF="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME:$VERSION"
          echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"
          echo "image=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Versión ya liberada
        if: env.YA_LIBERADA == 'true'
        run: |
          echo "v$VERSION ya existe: se reutiliza la imagen publicada y solo se vuelve a desplegar."
          echo "## ♻️ v$VERSION ya estaba liberada: se re-despliega \`$IMAGE_REF\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.YA_LIBERADA != 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: env.YA_LIBERADA != 'true'
        with:
          path: artefactos

      - name: Cargar la imagen exacta que pasó las pruebas
        if: env.YA_LIBERADA != 'true'
        run: gunzip -c artefactos/imagen-docker/imagen.tar.gz | docker load

      - name: Publicar imagen en GitHub Container Registry
        if: env.YA_LIBERADA != 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME"
          for tag in $VERSION latest; do
            docker tag $IMAGE_NAME:$VERSION $REPO:$tag
            docker push $REPO:$tag
          done

      - name: Crear tag y GitHub Release
        if: env.YA_LIBERADA != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp artefactos/build/tareas-api.jar tareas-api-$VERSION.jar
          ( cd artefactos/karate-report && zip -qr ../../karate-report-$VERSION.zip . )
          {
            echo "## Imagen Docker"
            echo '```'
            echo "docker pull $IMAGE_REF"
            echo '```'
            echo
            echo "## Calidad"
            echo "Análisis de SonarQube Cloud: https://sonarcloud.io/project/overview?id=${GITHUB_REPOSITORY_OWNER}_${{ github.event.repository.name }}"
          } > notas.md
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file notas.md \
            --generate-notes \
            tareas-api-$VERSION.jar \
            karate-report-$VERSION.zip

      - name: Resumen del release
        if: env.YA_LIBERADA != 'true'
        run: |
          echo "## 🚀 Release v$VERSION publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "- Imagen: \`$IMAGE_REF\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v$VERSION" >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # 6. DESPLIEGUE CONTINUO en Render
  # Despliega la imagen EXACTA del release y comprueba en la URL pública que
  # responde la versión correcta (smoke test con Karate).
  # Requiere: secret RENDER_DEPLOY_HOOK y variable RENDER_URL (ver README).
  # ===========================================================================
  despliegue:
    name: 6 · Despliegue en Render
    needs: [configuracion, release]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production   # en Settings > Environments se puede exigir aprobación manual
      url: ${{ vars.RENDER_URL }}
    env:
      VERSION: ${{ needs.configuracion.outputs.version }}
      IMAGE_REF: ${{ needs.release.outputs.image }}
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      # La URL no es sensible: se acepta como variable (recomendado) o como secret
      RENDER_URL: ${{ vars.RENDER_URL || secrets.RENDER_URL }}
      # Solo para diagnosticar si el hook se guardó en la pestaña equivocada (no se usa su valor)
      HOOK_EN_VARIABLES: ${{ vars.RENDER_DEPLOY_HOOK != '' }}
    steps:
      - name: Verificar configuración de Render
        run: |
          ok=true
          if [[ -z "$RENDER_DEPLOY_HOOK" ]]; then
            ok=false
            if [[ "$HOOK_EN_VARIABLES" == "true" ]]; then
              echo "::error::RENDER_DEPLOY_HOOK está en la pestaña 'Variables'. Por ser una credencial debe ir en 'Secrets' (Settings > Secrets and variables > Actions > Secrets > New repository secret)."
            else
              echo "::error::No se encuentra el secret RENDER_DEPLOY_HOOK. Debe estar en Settings > Secrets and variables > Actions > pestaña 'Secrets' (no en Dependabot ni Codespaces), con ese nombre exacto."
            fi
          fi
          if [[ -z "$RENDER_URL" ]]; then
            ok=false
            echo "::error::No se encuentra RENDER_URL. Debe estar en Settings > Secrets and variables > Actions > pestaña 'Variables' (o 'Secrets'), con ese nombre exacto."
          fi
          [[ "$ok" == "true" ]] || exit 1
          # Normaliza la URL: sin barra final
          echo "RENDER_URL=${RENDER_URL%/}" >> "$GITHUB_ENV"
          echo "Configuración de Render encontrada: $RENDER_URL"

      - name: Disparar el despliegue de la imagen ${{ needs.release.outputs.image }}
        run: |
          img=$(jq -rn --arg v "$IMAGE_REF" '$v | @uri')
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK}&imgURL=${img}" -o respuesta.json
          echo "Despliegue solicitado: $(cat respuesta.json)"

      - name: Esperar a que Render sirva la versión ${{ needs.configuracion.outputs.version }}
        run: |
          for i in $(seq 1 80); do
            actual=$(curl -fsS --max-time 20 "$RENDER_URL/actuator/info" | jq -r '.build.version // empty' 2>/dev/null || true)
            echo "Intento $i: versión publicada = ${actual:-sin respuesta}"
            [[ "$actual" == "$VERSION" ]] && exit 0
            sleep 15
          done
          echo "::error::Render no publicó la versión $VERSION en 20 minutos"
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Smoke test post-despliegue (Karate @smoke contra la URL pública)
        run: >
          mvn -f acceptance-tests/pom.xml test
          -Dkarate.env=produccion
          -DbaseUrl=$RENDER_URL
          -DexpectedVersion=$VERSION
          "-Dkarate.options=--tags @smoke"

      - name: Resumen del despliegue
        run: |
          echo "## 🌐 Desplegado v$VERSION en Render" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $RENDER_URL/api/v1/tareas" >> "$GITHUB_STEP_SUMMARY"
          echo "- Imagen: \`$IMAGE_REF\`" >> "$GITHUB_STEP_SUMMARY"
