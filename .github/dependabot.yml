# Gestión de la configuración: las dependencias también se versionan y actualizan por PR,
# pasando por el mismo pipeline y los mismos quality gates.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "build", include: scope }
  - package-ecosystem: maven
    directory: /acceptance-tests
    schedule: { interval: weekly }
    commit-message: { prefix: "test" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci" }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "build" }
