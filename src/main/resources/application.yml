# =====================================================================
# GESTIÓN DE LA CONFIGURACIÓN
# Configuración común. Lo que cambia por entorno vive en application-<perfil>.yml
# y los secretos SOLO llegan por variables de entorno (nunca en el repositorio).
# Perfil activo: SPRING_PROFILES_ACTIVE (dev por defecto).
# =====================================================================
spring:
  application:
    name: tareas-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  datasource:
    url: ${DB_URL:jdbc:h2:mem:tareas;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}

server:
  # SERVER_PORT explícito > PORT (lo asigna Render y otras plataformas PaaS) > 8080
  port: ${SERVER_PORT:${PORT:8080}}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    git:
      mode: simple
    env:
      enabled: true

info:
  app:
    entorno: ${spring.profiles.active}
